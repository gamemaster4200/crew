<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CREW v0.0.1</title>
    <style>
        :root {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color-scheme: dark;
            background: #111318;
            color: #e8eaf0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(820px, 100%);
            background: #191c23;
            border: 1px solid #2d323d;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }

        .version {
            color: #8f98a8;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #3a414e;
            background: #101218;
            color: inherit;
            font: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #737f95;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            background: #e8eaf0;
            color: #15171c;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #status {
            color: #8f98a8;
        }

        #result {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #2d323d;
        }

        #answer {
            white-space: pre-wrap;
            line-height: 1.5;
            min-height: 40px;
        }

        #model {
            margin-top: 12px;
            color: #8f98a8;
            font-size: 13px;
        }

        .error {
            color: #ff9e9e;
        }
    </style>
</head>
<body>
<main>
    <h1>CREW</h1>
    <div class="version">v0.0.1 - one model, one request</div>

    <form id="chat-form">
        <textarea
            id="message"
            placeholder="&#1042;&#1074;&#1077;&#1076;&#1080;&#1090;&#1077; &#1079;&#1072;&#1087;&#1088;&#1086;&#1089;..."
            required
            autofocus
        ></textarea>

        <div class="actions">
            <button id="send" type="submit">Send</button>
            <span id="status">Ready</span>
        </div>
    </form>

    <section id="result">
        <div id="answer">&#1054;&#1090;&#1074;&#1077;&#1090; &#1084;&#1086;&#1076;&#1077;&#1083;&#1080; &#1087;&#1086;&#1103;&#1074;&#1080;&#1090;&#1089;&#1103; &#1079;&#1076;&#1077;&#1089;&#1100;.</div>
        <div id="model"></div>
    </section>
</main>

<script>
    const form = document.getElementById("chat-form");
    const message = document.getElementById("message");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");
    const model = document.getElementById("model");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const text = message.value.trim();
        if (!text) return;

        send.disabled = true;
        status.textContent = "Calling OpenAI...";
        answer.classList.remove("error");
        answer.textContent = "";
        model.textContent = "";

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || `HTTP ${response.status}`);
            }

            answer.textContent = data.answer;
            model.textContent = `Model: ${data.model}`;
            status.textContent = "Done";
        } catch (error) {
            answer.classList.add("error");
            answer.textContent = error.message;
            status.textContent = "Failed";
        } finally {
            send.disabled = false;
        }
    });
</script>
</body>
</html>
